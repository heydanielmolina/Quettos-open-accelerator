[project]
name = "quettos"
version = "0.1.0"
description = "Quettos Core: an open, inference-only weight-streaming LLM accelerator (software stack: model download, quantization, compiler, golden model, ISA simulator)."
license = "Apache-2.0"
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = [
    "numpy>=2.0",
    "safetensors>=0.4",
    "tokenizers>=0.20",
    "huggingface_hub>=0.30",
    "jinja2>=3.1",
    "pytest>=8.0",
]

[project.scripts]
quettos = "quettos.cli:main"

[dependency-groups]
# Reference/quality stack (torch CPU). Never installed in CI.
ref = [
    "torch>=2.4",
    "transformers>=4.45",
    "datasets>=3.0",
]
# Hardware verification and lint helpers: what `make test`, `make cocotb` and
# `make style` need on top of the project's own dependencies. uv syncs this
# group by default, so a clean clone gets it -- keep it to what a checkout has
# to have, and nothing that only one target uses.
dev = [
    "mpmath>=1.3",      # exact table generation (quettos.lutgen)
    "cocotb>=2.1",
    "ruff>=0.16",       # `make style`, the Python half of the lint
]
# Place and route, for the ECP5 fmax run of docs/ROADMAP.md: a wasm build of
# nextpnr, 30 MB, and the wasmtime runtime under it, 8 MB more. No target in
# this repository runs it, so it is a group of its own and a clean clone does
# not carry it; `uv sync --group pnr` installs it.
pnr = [
    "yowasp-nextpnr-ecp5",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["sw/quettos"]

[tool.uv]
# Always use a uv-managed CPython so the Homebrew/conda interpreters on dev machines are never picked up.
python-preference = "only-managed"

[tool.pytest.ini_options]
testpaths = ["sw/tests"]
markers = [
    "slow: complete-model runs of several minutes (deselect with -m 'not slow')",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
