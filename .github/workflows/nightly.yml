# Quettos Core nightly: the checks that are too long for a pull request
# (docs/VERIFICATION.md layer 8). The two end-to-end jobs build a compiled
# image from the checkpoint and run the whole oracle chain on it, and
# determinism-model runs one complete model at both port widths and at every
# memory and thread setting; the three jobs that are still held say on the gate
# what they are waiting for, and their step repeats it so a manual run reports
# it.
# The whole-core xc7 synthesis is not here: `make synth` runs it on every pull
# request and rewrites syn/reports/qcore_top.md from the run.
#
# Action versions were checked against the upstream repos on 2026-09-02:
#   actions/checkout v7, actions/cache v6, astral-sh/setup-uv v10.0.1 (exact tag; it publishes no floating v10),
#   YosysHQ/setup-oss-cad-suite v4 (v4.1.0), oss-cad-suite release 2026-09-01.
name: nightly

on:
  schedule:
    - cron: "0 3 * * *"   # 03:00 UTC daily
  workflow_dispatch:

env:
  OSS_CAD_SUITE_VERSION: "2026-09-01"

jobs:
  # The whole oracle chain on a complete model: quantize and compile the
  # checkpoint, run the image's own prompt and the decode steps after it on
  # qcore_top and on the ISA simulator and compare the ids, compare the state
  # after every descriptor of both programs of the complete model, then run
  # every descriptor of the same programs against the integer golden model. The
  # three commands together are RTL == isa_sim == golden (docs/VERIFICATION.md,
  # layers 4 and 5). Qwen is the long one and SmolLM2 the one that generates
  # four tokens; both run the compiled program's six vector opcodes on
  # qcore_vpu_top.
  e2e-qwen:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/oss-cad-suite
          key: oss-cad-suite-${{ runner.os }}-${{ env.OSS_CAD_SUITE_VERSION }}
      - uses: YosysHQ/setup-oss-cad-suite@v4
        with:
          version: ${{ env.OSS_CAD_SUITE_VERSION }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      # The checkpoint: sw/quettos/model.py downloads into build/models/<name>
      # and keeps the Hub cache in build/hf_cache, so ~/.cache is never written.
      - uses: actions/cache@v6
        with:
          path: |
            build/models
            build/hf_cache
          key: hf-qwen2.5-0.5b-instruct-${{ hashFiles('sw/quettos/model.py') }}
      - run: uv sync --frozen
      - name: Download the checkpoint (ungated, no token)
        run: uv run quettos download qwen
      - name: Quantize and compile the whole model
        run: |
          uv run quettos quantize qwen
          uv run quettos compile qwen
      - name: qcore_top against the ISA simulator, generated ids
        run: uv run quettos compare --image build/images/qwen2.5-0.5b-instruct --wb 64 --generate 1
      # Every descriptor of both programs of the complete model, on qcore_top
      # and on the ISA simulator: the VSRAM range, the scale registers, the KV
      # bytes, the CSRs and the counters after each one. Two prefill positions
      # and two decode steps, so the cache the first decode step writes is what
      # the second reads.
      - name: qcore_top against the ISA simulator, every descriptor of the complete model
        run: |
          make stepcmp-model STEPCMP_MODEL="--models qwen --layers all --wb 64 \
            --max-ctx 128 --prompt-len 3 --max-new 2"
      # One prompt: the other expected-tokens prompt is 180 tokens on Qwen, and
      # both machines walk every descriptor of every position.
      - name: The ISA simulator against the integer golden model, every descriptor
        run: uv run quettos isa-sim qwen --compare --max-new 1 --prompt prompts/chat_short.json

  e2e-smollm2:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/oss-cad-suite
          key: oss-cad-suite-${{ runner.os }}-${{ env.OSS_CAD_SUITE_VERSION }}
      - uses: YosysHQ/setup-oss-cad-suite@v4
        with:
          version: ${{ env.OSS_CAD_SUITE_VERSION }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      # The checkpoint: sw/quettos/model.py downloads into build/models/<name>
      # and keeps the Hub cache in build/hf_cache, so ~/.cache is never written.
      - uses: actions/cache@v6
        with:
          path: |
            build/models
            build/hf_cache
          key: hf-smollm2-135m-instruct-${{ hashFiles('sw/quettos/model.py') }}
      - run: uv sync --frozen
      - name: Download the checkpoint (ungated, no token)
        run: uv run quettos download smollm2
      - name: Quantize and compile the whole model
        run: |
          uv run quettos quantize smollm2
          uv run quettos compile smollm2
      - name: qcore_top against the ISA simulator, generated ids
        run: uv run quettos compare --image build/images/smollm2-135m-instruct --wb 64 --generate 4
      - name: qcore_top against the ISA simulator, every descriptor of the complete model
        run: |
          make stepcmp-model STEPCMP_MODEL="--models smollm2 --layers all --wb 64 \
            --max-ctx 128 --prompt-len 3 --max-new 2"
      - name: The ISA simulator against the integer golden model, every descriptor
        run: uv run quettos isa-sim smollm2 --compare --max-new 4

  # Determinism and configuration equivalence on a complete model
  # (docs/VERIFICATION.md, layer 5). SmolLM2 is compiled at WB=64 and at
  # WB=128 -- separate compiles of the same weights, to the same context, so the
  # two images carry the same VSRAM map -- and one decoder layer of the compiled
  # decode.prog plus the image's own prefill/decode loop run at `--lat` 1 / 32 /
  # 200, at one returned beat every two cycles, at one thread and at four, and at
  # both widths. Every run is compared with the run at the configuration every
  # measurement is taken at: the cycle counts move, the ids and the dumped state
  # do not. The width half runs that decoder layer at every position the two
  # widths share and compares the VSRAM elements, the scale registers, the CSRs
  # and the event counters after each of its descriptors; the two traffic
  # counters are the width's own, since a partial last tile is padded to it. The
  # pull-request job set runs the same check on a random tiny model through
  # `make determinism` and `sw/tests/test_determinism.py`.
  determinism-model:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/oss-cad-suite
          key: oss-cad-suite-${{ runner.os }}-${{ env.OSS_CAD_SUITE_VERSION }}
      - uses: YosysHQ/setup-oss-cad-suite@v4
        with:
          version: ${{ env.OSS_CAD_SUITE_VERSION }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      # The checkpoint: sw/quettos/model.py downloads into build/models/<name>
      # and keeps the Hub cache in build/hf_cache, so ~/.cache is never written.
      - uses: actions/cache@v6
        with:
          path: |
            build/models
            build/hf_cache
          key: hf-smollm2-135m-instruct-${{ hashFiles('sw/quettos/model.py') }}
      - run: uv sync --frozen
      - name: Download the checkpoint (ungated, no token)
        run: uv run quettos download smollm2
      - name: Quantize and compile the whole model at both port widths
        run: |
          uv run quettos quantize smollm2
          uv run quettos compile smollm2
          uv run quettos compile smollm2 --wb 128 --out build/images/smollm2-135m-instruct-wb128
      - name: One program every way the machine allows
        run: |
          make determinism-model \
            IMAGE=build/images/smollm2-135m-instruct \
            WB128_IMAGE=build/images/smollm2-135m-instruct-wb128 \
            DETERMINISM_MODEL="--checks timing,width --program layer --generate 1"

  synth-ecp5:
    if: false   # held: syn/ carries no ECP5 script. The job runs with the ECP5 target -- synth_ecp5 stat and a yowasp-nextpnr-ecp5 fmax (docs/ROADMAP.md, v1.1)
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v7
      - run: echo "synth-ecp5 is held until syn/ carries an ECP5 script -- synth_ecp5 stat and a yowasp-nextpnr-ecp5 fmax (docs/ROADMAP.md, v1.1)"

  # `make determinism-x` builds the harness with XINIT=unique and replays a whole
  # program from an undefined start: zeros, ones and eight seeded starts, on the
  # layer and the bring-up programs. Twenty-one of its twenty-two runs produce
  # the baseline's values; one simulation-only check still stops the twenty-second.
  # rtl/qcore_lut_interp.sv checks that the interpolated value stays in [0,
  # 65535] whenever its `in_valid` is high, and qcore_vpu_scalar.sv raises
  # `in_valid` on both interpolators for every scalar request while enabling only
  # the table the request needs, so the other one still holds the sample
  # registers the start put there. The bring-up program's first scalar request is
  # a reciprocal, so the rsqrt samples are that start value, and one of the eight
  # seeds puts a pair there that leaves the range. The job runs when that check
  # reads only the table its request addressed.
  x-initial-unique:
    if: false   # held: rtl/qcore_lut_interp.sv checks the table a scalar request did not address, whose sample registers hold whatever `--x-initial unique` put in them
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - run: echo "x-initial-unique is held until the range check of rtl/qcore_lut_interp.sv reads only the table its request addressed; make determinism-x runs the check and names the run it stops on"

  quality-regen:
    if: false   # held: `uv run quettos check` scores the calibration corpus. The job scores golden vs HF fp32 over >= 32k WikiText-2 tokens (installs the optional 'ref' group) and runs when that command takes the wider set (docs/ROADMAP.md, v1.1)
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v7
      - run: echo "quality-regen is held until uv run quettos check scores a set wider than the calibration corpus -- at least 32k WikiText-2 tokens against HF fp32 (docs/ROADMAP.md, v1.1)"
