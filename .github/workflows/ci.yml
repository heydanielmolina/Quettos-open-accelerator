# Quettos Core CI: three-parser lint and the software tests, the cocotb block
# tests on the tiny configuration, and the per-block synthesis. The e2e job is
# a skeleton that turns on with the Verilator harness (docs/VERIFICATION.md
# layer 8).
#
# Action versions were checked against the upstream repos on 2026-09-02:
#   actions/checkout v7, actions/cache v6, astral-sh/setup-uv v10.0.1 (exact tag; it publishes no floating v10),
#   YosysHQ/setup-oss-cad-suite v4 (v4.1.0), oss-cad-suite release 2026-09-01.
name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  OSS_CAD_SUITE_VERSION: "2026-09-01"   # dated release of YosysHQ/oss-cad-suite-build, pinned

jobs:
  lint-and-pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Cache OSS CAD Suite
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/oss-cad-suite
          key: oss-cad-suite-${{ runner.os }}-${{ env.OSS_CAD_SUITE_VERSION }}

      - name: Set up OSS CAD Suite (verilator, yosys, iverilog)
        uses: YosysHQ/setup-oss-cad-suite@v4
        with:
          version: ${{ env.OSS_CAD_SUITE_VERSION }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Print tool versions
        run: |
          verilator --version
          yosys -V
          iverilog -V 2>&1 | head -1
          uv --version

      - name: Lint (three parsers + forbidden-construct greps)
        run: make lint

      - name: Sync Python environment (core + dev groups, no torch)
        run: uv sync --frozen --group dev

      - name: pytest
        run: uv run pytest -q sw/tests

  # cocotb unit tests on the tiny configuration (WB=16, B_MAX=2, VL=2, VSRAM_WORDS=2048):
  # every rtl/*.sv block and the assembled GEMV path, built with Verilator through
  # cocotb's runner (make cocotb). A clean build and run takes under a minute locally.
  cocotb-units:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: lint-and-pytest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/oss-cad-suite
          key: oss-cad-suite-${{ runner.os }}-${{ env.OSS_CAD_SUITE_VERSION }}
      - uses: YosysHQ/setup-oss-cad-suite@v4
        with:
          version: ${{ env.OSS_CAD_SUITE_VERSION }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - run: uv sync --frozen --group dev
      - run: make cocotb

  # per-block Yosys synth_xilinx (xc7) of the syn/*.ys scripts; the stat tables land in
  # build/synth/ and are recorded under syn/reports/.
  synth-xc7:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: lint-and-pytest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/oss-cad-suite
          key: oss-cad-suite-${{ runner.os }}-${{ env.OSS_CAD_SUITE_VERSION }}
      - uses: YosysHQ/setup-oss-cad-suite@v4
        with:
          version: ${{ env.OSS_CAD_SUITE_VERSION }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - run: make synth

  # --- enabled once the Verilator harness lands: tiny-shape RTL vs isa_sim end-to-end (-CFLAGS -O1 + ccache) ---
