# Quettos Core CI. Only lint-and-pytest is active so far. The other jobs are
# skeletons that turn on as the corresponding day's deliverable lands
# (see docs/ROADMAP.md and docs/VERIFICATION.md layer 8).
#
# Action versions were checked against the upstream repos on 2026-09-02:
#   actions/checkout v7, actions/cache v6, astral-sh/setup-uv v10,
#   YosysHQ/setup-oss-cad-suite v4 (v4.1.0), oss-cad-suite release 2026-09-01.
name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  OSS_CAD_SUITE_VERSION: "2026-09-01"   # dated release of YosysHQ/oss-cad-suite-build, pinned

jobs:
  lint-and-pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Cache OSS CAD Suite
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/oss-cad-suite
          key: oss-cad-suite-${{ runner.os }}-${{ env.OSS_CAD_SUITE_VERSION }}

      - name: Set up OSS CAD Suite (verilator, yosys, iverilog)
        uses: YosysHQ/setup-oss-cad-suite@v4
        with:
          version: ${{ env.OSS_CAD_SUITE_VERSION }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Print tool versions
        run: |
          verilator --version
          yosys -V
          iverilog -V 2>&1 | head -1
          uv --version

      - name: Lint (three parsers + forbidden-construct greps)
        run: make lint

      - name: Sync Python environment (core deps only, no torch)
        run: uv sync --frozen

      - name: pytest
        run: uv run pytest -q sw/tests

