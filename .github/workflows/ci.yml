# Quettos Core CI: three-parser lint, the Python lint and the software tests,
# the cocotb block tests on the tiny configuration, the bring-up comparison of
# qcore_top against the ISA simulator, the per-block synthesis, and the demo on
# the small model, checkpoint to text (docs/VERIFICATION.md layer 8). Every job
# runs on ubuntu-latest with its own timeout; lint-and-pytest gates the other
# five.
#
# Action versions were checked against the upstream repos on 2026-09-02:
#   actions/checkout v7, actions/cache v6, astral-sh/setup-uv v10.0.1 (exact tag; it publishes no floating v10),
#   YosysHQ/setup-oss-cad-suite v4 (v4.1.0), oss-cad-suite release 2026-09-01.
name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  OSS_CAD_SUITE_VERSION: "2026-09-01"   # dated release of YosysHQ/oss-cad-suite-build, pinned

jobs:
  lint-and-pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Cache OSS CAD Suite
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/oss-cad-suite
          key: oss-cad-suite-${{ runner.os }}-${{ env.OSS_CAD_SUITE_VERSION }}

      - name: Set up OSS CAD Suite (verilator, yosys, iverilog)
        uses: YosysHQ/setup-oss-cad-suite@v4
        with:
          version: ${{ env.OSS_CAD_SUITE_VERSION }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Print tool versions
        run: |
          verilator --version
          yosys -V
          iverilog -V 2>&1 | head -1
          uv --version

      # Every rtl/*.sv module and every sim/cocotb/wrappers/*.sv assembly as its
      # own top: 19 tops, zero warnings, no waivers.
      - name: Lint (three parsers + forbidden-construct greps)
        run: make lint

      - name: Sync Python environment (core + dev groups, no torch)
        run: uv sync --frozen --group dev

      # ruff, at the version uv.lock pins, over every .py in the repository:
      # the rules of [tool.ruff.lint] and the formatting of `ruff format`.
      - name: Lint and format-check the Python (ruff)
        run: make style

      - name: pytest
        run: uv run pytest -q sw/tests

  # cocotb block tests on the tiny configuration (WB=16, B_MAX=2, VL=2, VSRAM_WORDS=2048):
  # every rtl/*.sv block and the assembled GEMV path, built with Verilator through
  # cocotb's runner (make cocotb). sim/cocotb/README.md holds the local wall
  # clock of a clean build and run.
  # Build products are keyed by top, sources and parameters, so the two seq_fetch
  # width settings do not share object files.
  cocotb-units:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: lint-and-pytest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/oss-cad-suite
          key: oss-cad-suite-${{ runner.os }}-${{ env.OSS_CAD_SUITE_VERSION }}
      - uses: YosysHQ/setup-oss-cad-suite@v4
        with:
          version: ${{ env.OSS_CAD_SUITE_VERSION }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - run: uv sync --frozen --group dev
      - run: make cocotb

  # Yosys synth_xilinx (xc7) of every syn/synth_*.ys script, the whole core included:
  # the reports under syn/reports/ are regenerated and diffed, so a stale one fails.
  synth-xc7:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: lint-and-pytest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/oss-cad-suite
          key: oss-cad-suite-${{ runner.os }}-${{ env.OSS_CAD_SUITE_VERSION }}
      - uses: YosysHQ/setup-oss-cad-suite@v4
        with:
          version: ${{ env.OSS_CAD_SUITE_VERSION }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - run: make synth

  # Gate-level equivalence (docs/VERIFICATION.md layer 1): every block's Yosys
  # netlist against the SystemVerilog it came from, driven by one bench and
  # compared every cycle. 19 configurations of 15 blocks; sim/gatesim/README.md
  # holds the local wall clock.
  gatesim:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: lint-and-pytest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/oss-cad-suite
          key: oss-cad-suite-${{ runner.os }}-${{ env.OSS_CAD_SUITE_VERSION }}
      - uses: YosysHQ/setup-oss-cad-suite@v4
        with:
          version: ${{ env.OSS_CAD_SUITE_VERSION }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - run: uv sync --frozen
      - name: Netlist against source, every block
        run: make gatesim

  # qcore_top against sw/quettos/isa_sim.py on the tiny configuration (WB=16,
  # B_MAX=2, VL=2, VSRAM_WORDS=2048): the four-descriptor bring-up program of
  # docs/ISA.md, its directed vector program, the attention step of the
  # compiled decode.prog and the whole decoder layer, the last two at six
  # positions on one machine so each position reads the KV cache the one before
  # it wrote. Over random tiny models, every VSRAM element, SREG word, dumped
  # logit, KV byte, CSR and PERF counter compared, at LAT 1 / 32 / 200 and
  # --bw-div 2.
  # docs/PERFORMANCE.md holds the local wall clock of this target from a cold
  # Verilator build.
  bringup-tiny:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: lint-and-pytest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/oss-cad-suite
          key: oss-cad-suite-${{ runner.os }}-${{ env.OSS_CAD_SUITE_VERSION }}
      - uses: YosysHQ/setup-oss-cad-suite@v4
        with:
          version: ${{ env.OSS_CAD_SUITE_VERSION }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      # The object directory is named after a hash of rtl/*.sv, rtl/*.svh, the
      # lookup-table images, the C++ and the configuration, so a stale entry is
      # simply not used.
      - uses: actions/cache@v6
        with:
          path: build/verilator
          key: verilator-${{ runner.os }}-${{ env.OSS_CAD_SUITE_VERSION }}-${{ hashFiles('rtl/**/*.sv', 'rtl/**/*.svh', 'rtl/gen/*.hex', 'sim/verilator/**') }}
      - run: uv sync --frozen
      - name: CSR driver against rtl/qcore_csr.sv
        run: make harness-csr
      - name: Bring-up comparison, tiny configuration
        run: make bringup

  # `make demo` on the small model: the whole pipeline a clean clone runs, in
  # the pull-request budget. It syncs the environment, fetches the checkpoint,
  # quantizes it, compiles the image and the two descriptor programs, builds the
  # harness and generates from the image's own prompt on qcore_top -- the
  # complete 30-layer SmolLM2-135M-Instruct, every descriptor of prefill.prog
  # and decode.prog at its real address, stride, meta and partial tile. The ids
  # are held to the golden model's recorded continuation
  # (models/smollm2-135m-instruct/expected_tokens.json) and any saturation or
  # range event fails the job. docs/PERFORMANCE.md holds the local wall clock
  # and the stage table.
  demo-smollm2:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: lint-and-pytest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/oss-cad-suite
          key: oss-cad-suite-${{ runner.os }}-${{ env.OSS_CAD_SUITE_VERSION }}
      - uses: YosysHQ/setup-oss-cad-suite@v4
        with:
          version: ${{ env.OSS_CAD_SUITE_VERSION }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      # The checkpoint the demo fetches: sw/quettos/model.py downloads into
      # build/models/<name> and keeps the Hub cache in build/hf_cache.
      - uses: actions/cache@v6
        with:
          path: |
            build/models
            build/hf_cache
          key: hf-smollm2-135m-instruct-${{ hashFiles('sw/quettos/model.py') }}
      - uses: actions/cache@v6
        with:
          path: build/verilator
          key: verilator-wb64-${{ runner.os }}-${{ env.OSS_CAD_SUITE_VERSION }}-${{ hashFiles('rtl/**/*.sv', 'rtl/**/*.svh', 'rtl/gen/*.hex', 'sim/verilator/**') }}
      - name: The whole pipeline, checkpoint to text on qcore_top
        run: make demo
